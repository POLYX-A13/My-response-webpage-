<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Consent & Response Form</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0;padding:24px}
    .card{max-width:560px;margin:30px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 6px 25px #0001}
    h1{margin-top:0}.note{background:#eef6ff;padding:12px;border-radius:10px}
    label{display:block;margin:16px 0 6px;font-weight:600}
    input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #bbb;border-radius:9px;font:inherit}
    textarea{min-height:110px}
    button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:9px;background:#1769e0;color:white;font-size:16px}
    #revealed{display:none;margin-top:20px;text-align:center}
    #revealed img{max-width:100%;border-radius:12px}
    .small{font-size:13px;color:#666}
  </style>
</head>
<body>
  <main class="card">
    <h1>Consent & Response Form</h1>

    <div class="note">
      Please answer voluntarily. This form does not ask for WhatsApp passwords,
      verification codes, QR codes, or private login information.
    </div>

    <form id="form"
          action="https://formspree.io/f/YOUR_FORM_ID"
          method="POST">

      <label for="name">Your name</label>
      <input id="name" name="name" required>

      <label for="reply">Your reply</label>
      <textarea id="reply" name="reply" required
        placeholder="Type your response here..."></textarea>

      <label>
        <input type="checkbox" id="consent" required>
        I understand that my answers will be submitted to the form owner.
      </label>

      <input type="hidden" name="_subject" value="New response from consent form">

      <button type="submit">Submit response</button>
      <p class="small">Only submit information you are comfortable sharing.</p>
    </form>

    <section id="revealed">
      <h2>Thank you!</h2>
      <p>Your response has been submitted.</p>
      <!-- Replace the image URL below with an image you are allowed to share. -->
      <img src="https://placehold.co/800x450?text=Your+Image"
           alt="Revealed image">
    </section>
  </main>

  <script>
    const form = document.getElementById("form");
    const revealed = document.getElementById("revealed");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const response = await fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: { "Accept": "application/json" }
      });

      if (response.ok) {
        form.style.display = "none";
        revealed.style.display = "block";
      } else {
        alert("The response could not be submitted. Check the form setup.");
      }
    });
  </script>
</body>
</html>
